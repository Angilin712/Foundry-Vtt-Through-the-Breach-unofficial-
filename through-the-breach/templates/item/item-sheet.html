<form class="{{cssClass}} flexcol" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" />
    <div class="header-fields">
      <h1 class="itemname">
        <input name="name" type="text" value="{{item.name}}" placeholder="{{localize 'TTB.Name'}}" />
      </h1>
      <div class="item-type">
        <label>{{localize 'TTB.Type'}}: </label>
        <span>{{item.type}}</span>
      </div>
    </div>
  </header>

  <div class="sheet-content flexcol">
    <div class="item-description">
      <label class="resource-label">{{localize 'TTB.Description'}}</label>
      <textarea name="system.description" rows="10">{{system.description}}</textarea>
    </div>
  </div>
</form>
